name: GTA LVIV BETA Windows client

# Builds the client the same way upstream MTA 1.6 CI does: windows-2022 + VS 2022 (v143).
# Local builds use VS 2026 (v145, C++17 for game_sa/multiplayer_sa); here those are switched back.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  win32:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: cache-dxfiles
        with:
          path: utils/DXFiles
          key: dxfiles-0001

      - name: Download DirectX
        if: steps.cache-dxfiles.outputs.cache-hit != 'true'
        run: Invoke-WebRequest https://mirror-cdn.multitheftauto.com/bdata/DXFiles.zip -OutFile utils/DXFiles.zip
        shell: powershell

      - name: Extract DirectX
        if: steps.cache-dxfiles.outputs.cache-hit != 'true'
        run: Expand-Archive -Path utils/DXFiles.zip -DestinationPath utils/DXFiles
        shell: powershell

      - name: Use upstream VS 2022 toolchain settings
        shell: powershell
        run: |
          (Get-Content premake5.lua -Raw) -replace 'toolset "v145"', 'toolset "v143"' | Set-Content premake5.lua -NoNewline
          foreach ($p in 'Client/game_sa/premake5.lua', 'Client/multiplayer_sa/premake5.lua') {
            (Get-Content $p -Raw) -replace 'cppdialect "C\+\+17"', 'cppdialect "C++14"' | Set-Content $p -NoNewline
          }
          (Get-Content win-create-projects.bat -Raw) -replace 'vs2026', 'vs2022' | Set-Content win-create-projects.bat -NoNewline

      - name: Install CEF
        run: utils\premake5 install_cef

      - name: Install data files
        run: utils\premake5 install_data

      - name: Run Build
        run: win-build.bat release win32
        shell: cmd
        env:
          DXSDK_DIR: './utils/DXFiles/'
          CI: 'true'

      - name: Package client
        shell: powershell
        run: |
          if (-not (Test-Path 'Bin/GTA LVIV BETA.exe')) { throw 'build failed: no GTA LVIV BETA.exe' }
          ./lviv-package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: gta-lviv-beta-client-win32
          path: Release/GTA LVIV BETA/
